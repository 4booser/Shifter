<app-modal [open]="open()" [title]="title()" (closed)="close()">
  <form class="modal-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span class="field-label">{{ 'Name' | t }}</span>
      <input type="text" formControlName="name" placeholder="Hookah" />
      @if (fieldError(form.controls.name, 'Name'); as text) {
        <small class="field-error">{{ text }}</small>
      }
    </label>

    <div class="field-row">
      <label class="field">
        <span class="field-label">{{ 'Price per unit' | t }}</span>
        <input type="number" formControlName="price" min="0" step="1" />
        @if (fieldError(form.controls.price, 'Price'); as text) {
          <small class="field-error">{{ text }}</small>
        }
      </label>

      <label class="field">
        <span class="field-label">{{ 'Your share, %' | t }}</span>
        <input type="number" formControlName="percentage" min="0" max="100" step="0.1" />
        @if (fieldError(form.controls.percentage, 'Percentage'); as text) {
          <small class="field-error">{{ text }}</small>
        }
      </label>
    </div>

    <p class="field-hint">{{ 'You keep' | t }} {{ perUnit | number: '1.0-2' }} {{ 'per unit sold.' | t }}</p>

    @if (editing() !== null) {
      <p class="field-hint">
        {{ 'Repricing is safe: days keep the price and percentage they were recorded with, so past earnings do not move.' | t }}
      </p>
    }

    <div class="modal-actions">
      <button type="button" class="button is-quiet" (click)="close()">{{ 'Cancel' | t }}</button>
      <button type="submit" class="button is-primary">
        {{ (editing() === null ? 'Create position' : 'Save changes') | t }}
      </button>
    </div>
  </form>
</app-modal>
