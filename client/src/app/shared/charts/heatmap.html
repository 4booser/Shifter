<div class="heatmap-frame">
  <div class="heatmap" role="img" aria-label="Activity heatmap">
    @for (week of weeks(); track $index) {
      <div class="heatmap-week">
        @for (cell of week; track $index) {
          @if (cell) {
            <span
              class="heatmap-cell"
              [attr.data-level]="cell.level"
              [class.is-hovered]="hovered()?.key === cell.key"
              (pointerenter)="hovered.set(cell)"
              (pointerleave)="hovered.set(null)"
            ></span>
          } @else {
            <span class="heatmap-cell is-void"></span>
          }
        }
      </div>
    }
  </div>

  @if (hovered(); as cell) {
    <div class="chart-tooltip" [style.left]="tooltipLeft(cell)">
      <strong>{{ cell.key }}</strong>
      <span>{{ format(cell.value) }}</span>
    </div>
  }

  <div class="heatmap-legend">
    <span>{{ 'less' | t }}</span>
    @for (level of [0, 1, 2, 3, 4]; track level) {
      <span class="heatmap-cell" [attr.data-level]="level"></span>
    }
    <span>{{ 'more' | t }}</span>
  </div>
</div>
