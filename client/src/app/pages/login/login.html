<main class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header class="auth-header">
      <h1>{{ 'Sign in' | t }}</h1>
      <p>{{ 'Welcome back to Shifter.' | t }}</p>
    </header>

    @if (error(); as text) {
      <p class="alert" role="alert">{{ text }}</p>
    }

    <label class="field">
      <span class="field-label">{{ 'Login' | t }}</span>
      <input
        type="text"
        formControlName="login"
        autocomplete="username"
        spellcheck="false"
      />
      @if (fieldError(form.controls.login, 'Login'); as text) {
        <small class="field-error">{{ text }}</small>
      }
    </label>

    <label class="field">
      <span class="field-label">{{ 'Password' | t }}</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      @if (fieldError(form.controls.password, 'Password'); as text) {
        <small class="field-error">{{ text }}</small>
      }
    </label>

    <app-google-button [returnUrl]="returnPath()" />

    <button type="submit" class="button is-primary is-block" [disabled]="pending()">
      {{ (pending() ? 'Signing in…' : 'Sign in') | t }}
    </button>

    <p class="switch">
      {{ 'No account yet?' | t }} <a routerLink="/register">{{ 'Create one' | t }}</a>
    </p>
  </form>

</main>
