name: CI

# Nothing was ever compiled before it reached main. The deploy workflow only
# fires on a push to main, so the first build of any change was the same run
# that also shipped it — and up to eleven dependency updates a week were merged
# without once being built. This runs on the proposal instead.
#
# And on main as well, since everything here goes straight there: three of
# these five jobs check things the deploy does not look at at all — the phone,
# migrations against a database with rows in it, and what the screens look
# like. Excluding main meant they had not run in six days, and three of them
# were red when they last did.
#
# A branch with a pull request open used to run everything twice, once for the
# push and once for the proposal, and each pair showed up as two checks.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch cancels the first: the older answer is not
# worth waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet test Shifter.sln --configuration Release

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run lint
        working-directory: web

      - run: npm test
        working-directory: web

      # The bundle is what people actually load, and it fails for reasons the
      # tests never see — a missing export, a type only used at build time.
      - run: npm run build
        working-directory: web

      # The leak check needs a running API and a database, so it lives in the
      # end-to-end job of the deploy workflow rather than here. Said out loud
      # because its absence from this file otherwise looks like an oversight.

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
        working-directory: mobile

      # The phone had no automated check at all until now, and its bugs are the
      # expensive kind: it writes to the same calendar the site reads.
      - run: npx tsc --noEmit
        working-directory: mobile

      # The calendar's date arithmetic, which no typecheck can be wrong about
      # quietly enough to matter and no reader can be right about reliably.
      - run: npm test
        working-directory: mobile

  migrations:
    name: Migrations on a database with rows in it
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shifter_user
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shifter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shifter_user -d shifter"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ConnectionStrings__Shifter: "Host=localhost;Port=5432;Database=shifter;Username=shifter_user;Password=ci"
      ConnectionStrings__Tokens: "Host=localhost;Port=5432;Database=tokens;Username=shifter_user;Password=ci"
      SHIFTER_JWT_KEY: ci-only-key-thirty-two-characters!!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Create the second database
        run: PGPASSWORD=ci psql -h localhost -U shifter_user -d shifter -c 'CREATE DATABASE tokens;'

      # Migrations have only ever been applied to an empty database, which
      # makes every failure that matters structurally invisible: a foreign key
      # over rows that already exist, a unique index over duplicates, a NOT
      # NULL on a populated table. So: migrate to the previous release, put
      # rows in, then migrate the rest of the way.
      #
      # The released code as a whole, not only its migrations: EF refuses to
      # run a snapshot older than the model it is built into, so swapping the
      # folder in place failed every branch that carried a migration.
      - name: Migrate to the last released schema
        run: |
          dotnet tool install --global dotnet-ef
          git fetch --depth=1 origin main
          git worktree add --detach ../released FETCH_HEAD
          dotnet restore ../released/server/Shifter.csproj
          dotnet restore server/Shifter.csproj
          dotnet ef database update --project ../released/server/Shifter.csproj --context ShifterDbContext
          dotnet ef database update --project ../released/server/Shifter.csproj --context TokensDbContext

      - name: Put rows in it
        run: PGPASSWORD=ci psql -h localhost -U shifter_user -d shifter -f .github/seed.sql

      - name: Migrate the rest of the way
        run: |
          dotnet ef database update --project server/Shifter.csproj --context ShifterDbContext
          dotnet ef database update --project server/Shifter.csproj --context TokensDbContext

      - name: The rows are still there
        run: |
          PGPASSWORD=ci psql -h localhost -U shifter_user -d shifter -tAc \
            'SELECT count(*) FROM "Users";' | grep -qv '^0$' \
            || { echo "the seeded rows did not survive the migration"; exit 1; }

  api:
    name: The API answering over HTTP
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shifter_user
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shifter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shifter_user -d shifter"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # One schema for both contexts, made and remade by the test host itself.
      ConnectionStrings__Shifter: "Host=localhost;Port=5432;Database=shifter;Username=shifter_user;Password=ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Everything this application promises about money happens across a
      # controller, EF and Postgres together, and until now nothing exercised
      # the three at once. Every money defect found in the last week survived
      # a unit test on fakes.
      #
      # The schema is built by the migrations from an empty schema on every
      # run, so this also watches the whole history execute — which the
      # migration guards, being text checks, never do.
      - run: dotnet test tests/Shifter.Api.Tests/Shifter.Api.Tests.csproj --nologo

  # Everything the deploy gates on, run here first. The deploy had checks of
  # its own that nothing ran before a merge: Next 16 pushed two pages over
  # the weight budget, every check on the proposal was green, and the first
  # anybody heard of it was a deploy that refused to ship.
  deploy-gate:
    name: What the deploy checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shifter_user
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shifter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shifter_user -d shifter"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ConnectionStrings__Shifter: "Host=localhost;Port=5432;Database=shifter;Username=shifter_user;Password=ci"
      ConnectionStrings__Tokens: "Host=localhost;Port=5432;Database=tokens;Username=shifter_user;Password=ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Give it a schema
        run: |
          dotnet tool install --global dotnet-ef
          dotnet restore server/Shifter.csproj
          PGPASSWORD=ci psql -h localhost -U shifter_user -d shifter -c 'CREATE DATABASE tokens;'
          dotnet ef database update --project server/Shifter.csproj --context ShifterDbContext
          dotnet ef database update --project server/Shifter.csproj --context TokensDbContext

      - name: Build the site into wwwroot
        run: npm ci && npm run build
        working-directory: web

      - name: Front-end weight within budget
        run: npm run budget
        working-directory: web

      - name: Serve it as production does
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5208
          SHIFTER_JWT_KEY: ci-only-key-thirty-two-characters!!
        run: |
          dotnet run --project server/Shifter.csproj -c Release --no-launch-profile &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5208/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "server never became healthy"; exit 1

      - name: Nobody else's rows
        run: ./scripts/leak-check.sh http://localhost:5208

      # The screens spec skips itself here; its own job below shoots them.
      - name: Walk through it
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
        working-directory: web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deploy-gate-traces
          path: web/test-results
          retention-days: 7

  screens:
    name: The screens, looked at
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shifter_user
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shifter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shifter_user -d shifter"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ConnectionStrings__Shifter: "Host=localhost;Port=5432;Database=shifter;Username=shifter_user;Password=ci"
      ConnectionStrings__Tokens: "Host=localhost;Port=5432;Database=tokens;Username=shifter_user;Password=ci"
      Jwt__Key: "ci-screenshots-signing-key-32-chars!!"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the site into wwwroot
        run: |
          cd web
          npm ci
          npm run build

      # Without this the database has no tables, every registration answers
      # 500, and not one shot is taken. This job has been reporting success
      # and uploading the committed baselines untouched — «look at the
      # pictures on the run» was pointing at pictures from a laptop.
      - name: Give it a schema
        run: |
          dotnet tool install --global dotnet-ef
          dotnet restore server/Shifter.csproj
          PGPASSWORD=ci psql -h localhost -U shifter_user -d shifter -c 'CREATE DATABASE tokens;'
          dotnet ef database update --project server/Shifter.csproj --context ShifterDbContext
          dotnet ef database update --project server/Shifter.csproj --context TokensDbContext

      - name: Serve the real thing
        run: |
          dotnet run --project server/Shifter.csproj --urls http://localhost:5208 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5208/login > /dev/null && break
            sleep 2
          done

      - name: Shoot the screens
        # A diff is a failure now. It could not be before: the baselines were
        # darwin-named, Linux renders differently, and --update-snapshots made
        # every run agree with itself by definition. Linux baselines are
        # committed beside the darwin ones, so this compares against something.
        #
        # Two percent of pixels is the tolerance, which is wide enough for
        # font hinting and narrow enough to catch a section that collapsed.
        # When it goes red, look at the diff in the artefact below before
        # reaching for --update-snapshots=all.
        env:
          SCREENS: '1'
        run: |
          cd web
          npx playwright install --with-deps chromium
          npx playwright test e2e/screens.spec.ts

      - name: Hang the shots on the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: |
            web/e2e/screens.spec.ts-snapshots/
            web/test-results/
          if-no-files-found: ignore
