<div class="shell">
  <header class="topbar">
    <span class="brand">Shifter</span>

    @if (user(); as current) {
      <span class="who">{{ current.login }}</span>
    }

    <button
      type="button"
      class="icon-button"
      aria-label="Settings"
      (click)="settingsOpen.set(true)"
    >
      <app-icon name="sliders" [size]="15" />
    </button>

    <button type="button" class="button is-quiet" (click)="logout()">
      <app-icon name="logout" />
      Sign out
    </button>
  </header>

  @if (error(); as text) {
    <p class="alert shell-alert" role="alert">{{ text }}</p>
  }

  @if (storeError(); as text) {
    <p class="alert shell-alert" role="alert">
      {{ text }}
      <button type="button" class="button is-quiet" (click)="dismiss()">Dismiss</button>
    </p>
  }

  <div class="dashboard">
    <app-sidebar />
    <app-month-grid />
    <app-day-panel />
  </div>
</div>

<app-settings-modal [open]="settingsOpen()" (closed)="settingsOpen.set(false)" />
