name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# A failed run should say which half broke, so the two stacks are separate jobs
# rather than one script that stops at the first error.
jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Shifter.sln

      # The API project builds the Angular bundle on publish; this job only
      # builds and tests, so npm is never invoked here.
      - name: Build
        run: dotnet build Shifter.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/Shifter.Tests/Shifter.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx ng test --watch=false
