<main class="auth-page">
  <section class="auth-card">
    <header class="auth-header">
      <h1>Shifter</h1>
      @if (user(); as current) {
        <p>Signed in as <strong>{{ current.login }}</strong> (id {{ current.id }}).</p>
      } @else if (error()) {
        <p>Could not load your profile.</p>
      } @else {
        <p>Loading your profile…</p>
      }
    </header>

    @if (error(); as text) {
      <p class="alert" role="alert">{{ text }}</p>
    }

    <button type="button" class="submit secondary" (click)="logout()">
      Sign out
    </button>
  </section>
</main>
