name: Deploy

# Only main deploys. dev is for CI alone, so a broken experiment cannot reach
# the server by being pushed to the wrong branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default: every job below asks for exactly what it uses.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/shifter

jobs:
  # The same checks a pull request runs, from the same file, called rather
  # than copied. This used to be two jobs of its own, Test and End-to-end,
  # which had drifted from CI: the deploy weighed the front end and nothing
  # before the merge did, so a green pull request produced a red deploy.
  #
  # deploying: true leaves out the migrations job, which compares against
  # origin/main and here would compare this commit with itself, and the
  # screens, which are for looking at a proposal. Reading the repository is
  # all any of it needs.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    with:
      deploying: true
    permissions:
      contents: read

  # Alongside the checks, not after them. Waiting for the checks before
  # starting nine minutes of image building made every deploy the sum of the
  # two. Starting early is safe because nothing built here is live: the images
  # get their commit tag and nothing else, nothing runs a commit tag until the
  # deploy job names it, and that job waits for the checks. A failed check
  # leaves an image in the registry that production never pulls, and that
  # never gets the checked-<sha> tag a release by hand asks for.
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided by Actions; no token to store anywhere.
          password: ${{ secrets.GITHUB_TOKEN }}

      # The app image and the migration image come from the same Dockerfile,
      # different stages, and are tagged with the same commit so a deployment
      # can never pair an app with someone else's schema.
      - name: App image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: final
          push: true
          build-args: |
            BUILD_REF=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}-migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # What happens once a commit has been built and has passed its checks, and
  # only then: the images are marked as checked, :latest moves, and the deploy
  # learns whether it should go. All three by pointing tags at the manifests
  # already pushed. Building again would cost the nine minutes this layout
  # exists to save, and would be a different image from the one that was
  # checked.
  latest:
    name: Mark checked, move latest
    needs: [checks, build]
    runs-on: ubuntu-24.04
    permissions:
      # The tip of main, read through the API.
      contents: read
      packages: write
    outputs:
      ship: ${{ steps.newest.outputs.ship }}
    steps:
      # Two pushes close together are checked side by side and finish in
      # either order. The production group lets one deployment wait and
      # cancels the one already waiting whenever another arrives, so an
      # older commit whose checks finished last would cancel the newer
      # one's waiting deploy and go live in its place, leaving production
      # behind main and behind :latest. So a pushed commit that is no longer
      # the tip of main moves neither: the commit that is will. It has to be
      # decided here, before the deploy job, because a job that is skipped
      # never joins the group and a job that has joined it can no longer
      # step back out of the newer one's way.
      #
      # Started by hand, the run ships what it was started on, as it always
      # has; :latest still moves only for the tip of main.
      - name: Still the newest
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)

          if [ "$tip" = "$GITHUB_SHA" ]; then
            newest=true
            ship=true
          else
            newest=false
            echo "::notice::main is at $tip now; :latest is left to that commit's run"
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              ship=true
            else
              ship=false
              echo "::notice::and so is production"
            fi
          fi

          echo "newest=$newest" >> "$GITHUB_OUTPUT"
          echo "ship=$ship" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A commit tag only says the images were built: "Build and push" runs
      # alongside the checks, so a commit that fails them still leaves its
      # images in the registry. checked-<sha> is the registry's record that
      # this commit passed, written by the only job that knows it, and it is
      # what scripts/deploy-by-hand.sh asks for before releasing anything.
      # Every commit that passes gets one, the newest or not.
      - name: Mark the images checked
        run: |
          for image in "$IMAGE" "$IMAGE-migrate"; do
            docker buildx imagetools create \
              --tag "$REGISTRY/$image:checked-$GITHUB_SHA" \
              "$REGISTRY/$image:$GITHUB_SHA"
          done

      - name: Point latest at this commit
        if: steps.newest.outputs.newest == 'true'
        run: |
          for image in "$IMAGE" "$IMAGE-migrate"; do
            docker buildx imagetools create \
              --tag "$REGISTRY/$image:latest" \
              "$REGISTRY/$image:$GITHUB_SHA"
          done

  deploy:
    name: Deploy
    # Explicitly: the images to pull, the checks that cleared them, and the
    # job that says whether this commit is still the one to ship. A failed
    # check skips that job and this one, so neither :latest nor production
    # is touched. A tag that cannot be written stops this too, so the two
    # never point at different commits.
    needs: [checks, build, latest]
    if: needs.latest.outputs.ship == 'true'
    runs-on: ubuntu-24.04
    # The server pulls with this run's token, so it needs to be able to read
    # packages — stated here rather than left to whatever the default is.
    permissions:
      contents: read
      packages: read
    # One deployment at a time, and a newer commit waits rather than racing.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before anything is copied anywhere — see docker/make-room.sh for why.
      # script_path is read here on the runner and run on the server, so this
      # works on a box too full to receive a file, and it is the same script
      # scripts/deploy-by-hand.sh runs when Actions is down.
      - name: Make room
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGES: ${{ env.REGISTRY }}/${{ github.repository_owner }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGES
          script_path: ${{ github.workspace }}/docker/make-room.sh

      - name: Ship the compose files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The whole docker/ directory rather than a list of files. The list
          # was written by hand, so adding a crontab line for a script without
          # adding the script to the list failed the deploy on chmod — a list
          # you have to remember is a list somebody forgets. release.sh rides
          # along with the rest.
          #
          # .env stays on the server and is never overwritten from here.
          #
          # Into a waiting room of this run's own, unpacked into the stack
          # by the next step under the release lock. scp-action cannot take
          # the lock, and copying straight into /opt/shifter let these files
          # land in the middle of a release from scripts/deploy-by-hand.sh,
          # which then brought up its own images on this commit's compose.
          source: "compose.prod.yaml,docker/"
          target: /opt/shifter/.incoming/${{ github.run_id }}-${{ github.run_attempt }}

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGES: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          RELEASE: ${{ github.sha }}
          STAGED: .incoming/${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The token is scoped to this run and expires with it, so the
          # server never holds a lasting credential for the registry.
          envs: REGISTRY_TOKEN,REGISTRY_USER,IMAGES,RELEASE,STAGED
          script: |
            set -euo pipefail
            cd /opt/shifter

            # The production group above serialises runs of this workflow
            # and nothing else; scripts/deploy-by-hand.sh releases from a
            # laptop and takes this same lock. Held from before the login
            # until after the logout in the trap below, so neither release can
            # log the other out mid-pull or bring up the other's .env.release.
            # Five minutes, inside ssh-action's own ten.
            exec 9>>.release.lock
            flock -w 300 9 || { echo "another release is still running on this box after five minutes"; exit 1; }

            # The files shipped above, put in place only now that nothing
            # else can release. Through tar, so each file is replaced rather
            # than written through, which release.sh's Caddy check expects.
            tar -cf - -C "$STAGED" compose.prod.yaml docker | tar -xf - -C /opt/shifter
            rm -rf "$STAGED"

            # Images pushed by Actions are private unless someone changes that
            # by hand, so the pull needs a login. Doing it here keeps the
            # package private without anyone storing a token on the server.
            #
            # The logout is a trap rather than a line at the end: it used to sit
            # only on the two successful exits inside the health loop, so a
            # deploy that failed earlier — a bad pull, a migration that aborted
            # — left the run's registry token sitting in ~/.docker/config.json,
            # base64 and not encrypted. `set -e` never reached the cleanup.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

            # Everything after the login lives in docker/release.sh, shipped
            # in the step above, so that scripts/deploy-by-hand.sh runs the
            # very same release when Actions cannot: backups and the restore
            # drill in the crontab, pull, up, the Caddy inode check, and the
            # wait for "(healthy)".
            bash docker/release.sh "$RELEASE"
