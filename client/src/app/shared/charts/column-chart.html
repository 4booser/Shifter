<div class="chart-frame">
  <svg [attr.viewBox]="viewBox" class="chart" role="img">
    @for (tick of ticks(); track tick.value) {
      <line class="gridline" x1="52" [attr.x2]="chartWidth - 6"
        [attr.y1]="tick.y" [attr.y2]="tick.y" />
      <text class="axis-text" x="46" [attr.y]="tick.y + 3" text-anchor="end">
        {{ formatAxis(tick.value) }}
      </text>
    }

    @for (key of [renderKey()]; track key) {
    @for (entry of columns(); track entry.label; let index = $index) {
      @if (entry.plannedHeight > 0.5) {
        <rect class="col is-planned" [attr.x]="entry.x" [attr.y]="entry.plannedY"
          [attr.width]="entry.width" [attr.height]="entry.plannedHeight" rx="2" />
      }
      @if (entry.earnedHeight > 0.5) {
        <path class="col" [class.is-hovered]="hovered() === index"
          [attr.d]="columnPath(entry.x, entry.earnedY, entry.width, entry.earnedHeight)" />
      }

      @if (labelVisible(index)) {
        <text class="axis-text" [attr.x]="entry.centre" [attr.y]="plotBottom + 14"
          text-anchor="middle">{{ entry.label }}</text>
      }

      @if (valueVisible(index)) {
        <text class="value-text" [attr.x]="entry.centre"
          [attr.y]="(entry.plannedHeight > 0.5 ? entry.plannedY : entry.earnedY) - 4"
          text-anchor="middle" [class.is-peak]="peakIndex() === index"
          >{{ format(entry.earned) }}</text>
      }

      <rect class="hit" [attr.x]="entry.x - 2" y="0"
        [attr.width]="entry.width + 4" [attr.height]="plotBottom"
        (pointerenter)="hovered.set(index)"
        (pointerleave)="hovered.set(null)" />
    }
    }
  </svg>

  @if (hovered() !== null && columns()[hovered()!]; as entry) {
    <div class="chart-tooltip" [style.left]="tooltipLeft(entry)">
      <strong>{{ entry.label }}</strong>
      <span>{{ format(entry.earned) }}</span>
      @if (entry.planned > 0) {
        <span class="tooltip-muted">+{{ format(entry.planned) }}</span>
      }
      @if (entry.hours > 0) {
        <span class="tooltip-muted">{{ entry.hours }} h</span>
      }
    </div>
  }
</div>
