name: Deploy

# Only main deploys. dev is for CI alone, so a broken experiment cannot reach
# the server by being pushed to the wrong branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/shifter

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet test Shifter.sln --configuration Release

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Type errors fail the build later and more expensively; catch them here.
      - run: npm run lint
        working-directory: web

      - run: npm test
        working-directory: web

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shifter_user
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: shifter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shifter_user -d shifter"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ConnectionStrings__Shifter: "Host=localhost;Port=5432;Database=shifter;Username=shifter_user;Password=e2e"
      ConnectionStrings__Tokens: "Host=localhost;Port=5432;Database=tokens;Username=shifter_user;Password=e2e"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Create the tokens database
        run: PGPASSWORD=e2e psql -h localhost -U shifter_user -d shifter -c 'CREATE DATABASE tokens;'

      - name: Apply migrations
        run: |
          dotnet tool install --global dotnet-ef
          dotnet restore server/Shifter.csproj
          dotnet ef database update --project server/Shifter.csproj --context ShifterDbContext
          dotnet ef database update --project server/Shifter.csproj --context TokensDbContext

      - name: Build the SPA into wwwroot
        run: npm ci && npm run build
        working-directory: web

      - name: Start the server
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5208
          SHIFTER_JWT_KEY: e2e-only-key-thirty-two-characters!!
        run: |
          dotnet run --project server/Shifter.csproj -c Release --no-launch-profile &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5208/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "server never became healthy"; exit 1

      - name: Run Playwright
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
        working-directory: web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  build:
    name: Build and push
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided by Actions; no token to store anywhere.
          password: ${{ secrets.GITHUB_TOKEN }}

      # The app image and the migration image come from the same Dockerfile,
      # different stages, and are tagged with the same commit so a deployment
      # can never pair an app with someone else's schema.
      - name: App image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: true
          build-args: |
            BUILD_REF=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}-migrate:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # The server pulls with this run's token, so it needs to be able to read
    # packages — stated here rather than left to whatever the default is.
    permissions:
      contents: read
      packages: read
    # One deployment at a time, and a newer commit waits rather than racing.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Ship the compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The stack definition travels with the release; .env stays on the
          # server and is never overwritten from here.
          source: "compose.prod.yaml,docker/Caddyfile,docker/init-databases.sh,docker/backup.sh"
          target: /opt/shifter

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The token is scoped to this run and expires with it, so the
          # server never holds a lasting credential for the registry.
          envs: REGISTRY_TOKEN,REGISTRY_USER
          script: |
            set -euo pipefail
            cd /opt/shifter

            # Images pushed by Actions are private unless someone changes that
            # by hand, so the pull below needs a login. Doing it here keeps the
            # package private without anyone storing a token on the server.
            #
            # The logout is a trap rather than a line at the end: it used to sit
            # only on the two successful exits inside the health loop, so a
            # deploy that failed earlier — a bad pull, a migration that aborted
            # — left the run's registry token sitting in ~/.docker/config.json,
            # base64 and not encrypted. `set -e` never reached the cleanup.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

            echo "REGISTRY=${{ env.REGISTRY }}/${{ github.repository_owner }}" > .env.release
            echo "TAG=${{ github.sha }}" >> .env.release

            # Nightly database dumps: the script ships with every release and
            # the crontab line is rewritten idempotently, so changing the
            # schedule or the script is just another deploy. The deploy user's
            # own crontab, because /etc/cron.d is root's and this user is not.
            chmod +x docker/backup.sh docker/restore-drill.sh
            mkdir -p backups "$HOME/.cache"
            # And a weekly restore drill, because a dump nobody has ever
            # restored is a hope rather than a backup. It loads the newest one
            # into a scratch database and compares row counts against the live
            # one — an empty restore loads perfectly and is worth nothing.
            ( crontab -l 2>/dev/null | grep -v -e shifter-backup -e shifter-restore-drill || true ; \
              echo '17 3 * * * /opt/shifter/docker/backup.sh >> /opt/shifter/backups/backup.log 2>&1 # shifter-backup' ; \
              echo '41 5 * * 1 /opt/shifter/docker/restore-drill.sh >> /opt/shifter/backups/restore-drill.log 2>&1 # shifter-restore-drill' \
            ) | crontab -

            docker compose -f compose.prod.yaml --env-file .env --env-file .env.release pull
            docker compose -f compose.prod.yaml --env-file .env --env-file .env.release up -d

            # A single file bind-mounted into a container is bound by inode,
            # and scp replaces the file rather than writing through it — so the
            # host gets the new config and the container goes on seeing the old
            # one. Reloading in place is therefore useless: Caddy re-reads the
            # same stale bytes and reports the config unchanged, which is how
            # this went unnoticed. Comparing what the container actually sees
            # against what was just shipped is the only honest check, and
            # recreating is what re-resolves the mount.
            if ! docker compose -f compose.prod.yaml exec -T proxy \
                 cat /etc/caddy/Caddyfile | cmp -s - docker/Caddyfile; then
              echo "proxy config changed; recreating"
              docker compose -f compose.prod.yaml --env-file .env --env-file .env.release \
                up -d --force-recreate proxy
            fi

            # Wait for the app to report healthy before calling this a success,
            # so a broken release fails the run instead of sitting there.
            for i in $(seq 1 30); do
              # The word to match is "(healthy)" with its bracket. Matching
              # 'shifter.*healthy' also matched "(unhealthy)" — the .* spans
              # the "un" — so a release that started but could not reach the
              # database was called green on the very first pass, and the only
              # alarm left was the ten-minute external probe.
              if docker compose -f compose.prod.yaml ps --format '{{.Service}} {{.Status}}' \
                 | grep -E '^shifter .*\(healthy\)' >/dev/null; then
                echo "healthy"
                # -a matters: every image here is tagged with its commit, so
                # the plain prune never matched anything and the disk filled
                # with 1.8 GB migrate images until the box hit 94%. Referenced
                # images survive; the 48h window keeps a rollback pair around.
                docker image prune -af --filter "until=48h"
                exit 0
              fi
              sleep 5
            done

            echo "did not become healthy in time"
            docker compose -f compose.prod.yaml ps
            docker compose -f compose.prod.yaml logs --tail 60 shifter
            exit 1
